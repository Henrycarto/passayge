name: Bug report
description: Something in the sandbox does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which patient, which provider you were acting as, and what you clicked. Use the synthetic patients only.
      placeholder: |
        1. Act as Dr. Lena Aigner
        2. Open BRANDSTÄTTER, Theresia
        3. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and system
      placeholder: Firefox 140 on Windows 11
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: My report contains no real patient or personal data.
          required: true
